<!DOCTYPE html>
<html>
<head>
    <title>Dog Park Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([39.8283, -98.5795], 5);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Dog Parks Data
        var dogParks = [
            { name: "Central Park Dog Run", lat: 40.785091, lon: -73.968285 },
            { name: "Griffith Park Dog Park", lat: 34.136554, lon: -118.294200 },
            { name: "Lincoln Park Dog Park", lat: 41.921438, lon: -87.647051 },
            { name: "Golden Gate Park Dog Park", lat: 37.769421, lon: -122.486214 },
            { name: "Zilker Park Dog Area", lat: 30.267153, lon: -97.743057 }
        ];

        // Add Markers for Dog Parks
        dogParks.forEach(function(park) {
            L.marker([park.lat, park.lon]).addTo(map)
                .bindPopup("<b>" + park.name + "</b><br>🐶 Great place for dogs!");
        });

        // Function to Request Location
        function requestLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var userLat = position.coords.latitude;
                    var userLon = position.coords.longitude;

                    L.marker([userLat, userLon])
                        .addTo(map)
                        .bindPopup("<b>You are here!</b> 🏠").openPopup();

                    map.setView([userLat, userLon], 13);
                },
                function(error) {
                    console.error("Geolocation error: " + error.message);
                    alert("Location access denied. Please enable it in your browser settings.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Request location on page load
        document.addEventListener("DOMContentLoaded", requestLocation);
    </script>
</body>
</html>
