<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
    <title>Dog Park Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([39.8283, -98.5795], 5); // USA Center

        // Add OpenStreetMap tiles (FREE)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Example Dog Park Locations
        var dogParks = [
            { name: "Central Park Dog Run", lat: 40.785091, lon: -73.968285 },
            { name: "Griffith Park Dog Park", lat: 34.136554, lon: -118.294200 },
            { name: "Lincoln Park Dog Park", lat: 41.921438, lon: -87.647051 },
            { name: "Golden Gate Dog Park", lat: 37.769421, lon: -122.486214 },
            { name: "Zilker Park Dog Area", lat: 30.267153, lon: -97.743057 }
        ];

        // Add Dog Park Markers to Map
        dogParks.forEach(function(park) {
            L.marker([park.lat, park.lon])
                .addTo(map)
                .bindPopup("<b>" + park.name + "</b><br>Great place for dogs! 🐶");
        });

        // Get User Location
        function onLocationFound(e) {
            var userMarker = L.marker(e.latlng, {color: "blue"}).addTo(map)
                .bindPopup("You are here 🏠").openPopup();
            map.setView(e.latlng, 13);
        }

        function onLocationError(e) {
            alert("Location access denied.");
        }

        map.locate({setView: true, maxZoom: 16, watch: true});
        map.on("locationfound", onLocationFound);
        map.on("locationerror", onLocationError);
    </script>
</body>
</html>
