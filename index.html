<!DOCTYPE html>
<html>
<head>
    <title>Dog Park Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <meta http-equiv="Permissions-Policy" content="geolocation=(self, *)">
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([39.8283, -98.5795], 5); // Centered on USA

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Example Dog Park Locations
        var dogParks = [
            { name: "Central Park Dog Run", lat: 40.785091, lon: -73.968285 },
            { name: "Griffith Park Dog Park", lat: 34.136554, lon: -118.294200 },
            { name: "Lincoln Park Dog Park", lat: 41.921438, lon: -87.647051 },
            { name: "Golden Gate Park Dog Park", lat: 37.769421, lon: -122.486214 },
            { name: "Zilker Park Dog Area", lat: 30.267153, lon: -97.743057 }
        ];

        // Add Dog Park Markers
        dogParks.forEach(function(park) {
            L.marker([park.lat, park.lon]).addTo(map)
                .bindPopup("<b>" + park.name + "</b><br>🐶 Great place for dogs!");
        });

        // OpenCage API Key for Geocoding
        const OPEN_CAGE_API_KEY = "3dc3d969f39a40229ac810583a4b2f1f";

        // Function to Convert Address to Latitude/Longitude
        function getLatLonFromAddress(address, callback) {
            fetch(`https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(address)}&key=${OPEN_CAGE_API_KEY}`)
            .then(response => response.json())
            .then(data => {
                if (data.results.length > 0) {
                    let lat = data.results[0].geometry.lat;
                    let lon = data.results[0].geometry.lng;
                    callback(lat, lon);
                } else {
                    console.error("No results found for address:", address);
                }
            })
            .catch(error => console.error("Geocoding API error:", error));
        }

        // Fetch User Locations from Adalo API
        fetch("https://api.adalo.com/v0/apps/e094b400-728d-4dde-aadd-873eacc862f7/collections/t_0b0ff4d7fbeb4e8aaabf11a987f79dfb?offset=0&limit=100", {
            method: "GET",
            headers: {
                "Authorization": "Bearer bu8r93byrawp8js5vgtgdk13y",
                "Content-Type": "application/json"
            }
        })
        .then(response => response.json())
        .then(data => {
            data.records.forEach(user => {
                if (user.location) { // Assuming 'location' is the field storing addresses
                    getLatLonFromAddress(user.location, function(lat, lon) {
                        L.marker([lat, lon]).addTo(map)
                            .bindPopup(`<b>${user.name}</b><br>📍 User Location`);
                    });
                }
            });
        })
        .catch(error => console.error("Error fetching user location from Adalo:", error));

        // Get User's Current Location and Show on Map
        function requestLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var userLat = position.coords.latitude;
                    var userLon = position.coords.longitude;

                    L.marker([userLat, userLon], {
                        icon: L.divIcon({ className: 'user-location', html: '📍', iconSize: [30, 30] })
                    }).addTo(map)
                    .bindPopup("<b>You are here!</b> 🏠").openPopup();

                    map.setView([userLat, userLon], 13);
                },
                function(error) {
                    console.error("Geolocation error: " + error.message);
                    alert("Location access denied. Please enable it in browser settings.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Auto-request location when loaded (fixes iframe issues in Adalo)
        document.addEventListener("DOMContentLoaded", function() {
            if (window.self !== window.top) {
                console.log("Running inside an iframe (Adalo Web View detected)");
            }
            requestLocation();
        });

    </script>
</body>
</html>
