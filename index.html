<!DOCTYPE html>
<html>
<head>
    <title>Dog Park Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize the map centered on the USA
        var map = L.map('map').setView([39.8283, -98.5795], 5);

        // Add OpenStreetMap tiles (FREE)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Sample Dog Parks with Name, Latitude & Longitude
        var dogParks = [
            { name: "Central Park Dog Run", lat: 40.785091, lon: -73.968285 },
            { name: "Griffith Park Dog Park", lat: 34.136554, lon: -118.294200 },
            { name: "Lincoln Park Dog Park", lat: 41.921438, lon: -87.647051 },
            { name: "Golden Gate Park Dog Park", lat: 37.769421, lon: -122.486214 },
            { name: "Zilker Park Dog Area", lat: 30.267153, lon: -97.743057 }
        ];

        // Add Dog Park Markers to Map
        dogParks.forEach(function(park) {
            L.marker([park.lat, park.lon])
                .addTo(map)
                .bindPopup("<b>" + park.name + "</b><br>🐶 Great place for dogs!");
        });

        // Function to Handle User Location Success
        function getLocation(position) {
            var userLat = position.coords.latitude;
            var userLon = position.coords.longitude;

            L.marker([userLat, userLon])
                .addTo(map)
                .bindPopup("<b>You are here!</b> 🏠").openPopup();

            map.setView([userLat, userLon], 13);
        }

        // Function to Handle Errors
        function showError(error) {
            alert("Geolocation error: " + error.message);
        }

        // Request Location Permissions Before Attempting Geolocation
        navigator.permissions.query({ name: "geolocation" }).then(function(result) {
            if (result.state === "granted") {
                console.log("Geolocation permission granted.");
                navigator.geolocation.getCurrentPosition(getLocation, showError);
            } else if (result.state === "prompt") {
                console.log("Geolocation permission needs to be requested.");
                navigator.geolocation.getCurrentPosition(getLocation, showError);
            } else {
                alert("Location access denied. Please enable it in browser settings.");
            }
        });

    </script>
</body>
</html>
